name: Build and Push Docker Images

on:
  push:
    branches:
      - '*'



jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        run: |
          docker build -t my-docker-registry/xmart-backend:latest -f xmart-city-backend/Dockerfile xmart-city-backend/
          docker push my-docker-registry/xmart-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t my-docker-registry/xmart-frontend:latest -f xmart-frontend/Dockerfile xmart-frontend/
          docker push my-docker-registry/xmart-frontend:latest
